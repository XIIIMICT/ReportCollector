#:schema https://www.schemastore.org/prek.json

orphan = true
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "bun-lock"
name = "bun lock"
entry = "bun install --lockfile-only"
language = "system"
pass_filenames = false
files = '^package\.json$'

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
entry = "bun format"
language = "system"
files = '\.(cjs|css|cts|js|json|jsonc|jsx|mjs|mts|scss|ts|tsx)$'

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "bunx oxlint --fix"
language = "system"
# JS/TS only: oxlint can't lint CSS/SCSS/JSON and fails when given only
# those files (a CSS-only commit would be blocked).
files = '\.(cjs|cts|js|jsx|mjs|mts|ts|tsx)$'

[[repos.hooks]]
id = "stylelint"
name = "stylelint"
entry = "bunx stylelint --fix"
language = "system"
# CSS only — the counterpart of the note above: oxlint handles JS/TS, stylelint
# handles the stylesheets, so a CSS-only commit runs just this one.
files = '\.css$'

[[repos.hooks]]
id = "bun-test"
name = "bun test"
entry = "bun test"
language = "system"
pass_filenames = false
files = '^(package\.json|bunfig\.toml|tsconfig.*\.json|.*\.(cts|mts|ts|tsx))$'

[[repos.hooks]]
id = "bun-typecheck"
name = "bun check"
entry = "bun typecheck"
language = "system"
pass_filenames = false
files = '^(package\.json|bunfig\.toml|tsconfig.*\.json|.*\.(cts|mts|ts|tsx))$'
