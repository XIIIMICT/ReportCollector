#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit"]
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "bun-lock"
name = "bun lock"
entry = "bun install --lockfile-only"
language = "system"
pass_filenames = false
files = '^package\.json$'

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
# `oxfmt` takes the files to format as positional arguments, so the hook calls
# the binary directly: `bun run format` would run the project-wide script and
# rewrite whatever another agent is editing right now.
entry = "bunx oxfmt"
language = "system"
files = '\.(cjs|css|cts|js|json|jsonc|jsx|mjs|mts|scss|ts|tsx)$'

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "bunx oxlint --fix"
language = "system"
# JS/TS only: oxlint can't lint CSS/SCSS/JSON and fails when given only those
# files (a CSS-only commit would be blocked).
files = '\.(cjs|cts|js|jsx|mjs|mts|ts|tsx)$'

[[repos.hooks]]
id = "stylelint"
name = "stylelint"
entry = "bunx stylelint --fix"
language = "system"
# CSS only — the counterpart of the note above: oxlint handles JS/TS, stylelint
# the stylesheets, so a CSS-only commit runs just this one.
files = '\.css$'

[[repos.hooks]]
id = "bun-test"
name = "bun test"
# The whole suite: it is the project's regression net and a partial run would
# claim a green commit on evidence it never gathered. Fast enough (~5 s).
entry = "bun run test"
language = "system"
pass_filenames = false
files = '^(package\.json|bunfig\.toml|tsconfig.*\.json|.*\.(cts|mts|ts|tsx))$'

[[repos.hooks]]
id = "bun-typecheck"
name = "bun check"
# Shared hook policy (maintainer decision, 2026-11-25): staged files at commit,
# whole tree in CI. `bun check <files>` still resolves types across imports.
entry = "bun run typecheck"
language = "system"
files = '\.(cjs|cts|js|jsx|mjs|mts|ts|tsx)$'
require_serial = true
