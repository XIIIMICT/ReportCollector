# Alertmanager: routing and delivery.
#
# DELIVERY IS WIRED and verified end-to-end (2026-10-27): a test alert produces
# `msg="Notify success" component=dispatcher receiver=support-mail
# integration=email[0]` and the mail arrives. The details and the two traps that
# cost the most time — port 465 is implicit TLS and cannot be used with
# `smtp_require_tls`, and `ALERT_SMTP_USER` must be the SENDER mailbox — are in
# `docs/SCALING_BACKLOG.md` §2. Do not repeat the diagnosis there.
#
# `to`/`from`/`smarthost` are rendered at CONTAINER START by `entrypoint.sh`
# (sed over this file) from `.env`: Alertmanager does NOT expand `${VAR}` in
# those fields, and `--setenv` does not help. Editing `.env` therefore needs
# `just monitoring` (a restart), not a reload.

global:
  resolve_timeout: 5m
  # STARTTLS is required, which is why the smarthost must be a port that
  # ADVERTISES it (587). Port 465 speaks implicit TLS only and Alertmanager
  # rejects it before authenticating.
  smtp_require_tls: true

route:
  receiver: support-mail
  group_by: [alertname]
  # A 5xx burst must not send one mail per minute: group for 30 s, then keep
  # updating every 4 h while it is still firing.
  group_wait: 30s
  group_interval: 4h
  repeat_interval: 4h

receivers:
  - name: support-mail
    email_configs:
      # `to`/`from`/`smarthost` are filled by `entrypoint.sh` (envsubst) from
      # `.env` — Alertmanager does not expand variables in these fields itself.
      - to: "${SUPPORT_MAIL}"
        from: "${ALERT_SMTP_FROM}"
        smarthost: "${ALERT_SMTP_SMARTHOST}"
        auth_username: "${ALERT_SMTP_USER}"
        auth_password: "${ALERT_SMTP_PASSWORD}"
        send_resolved: true
        headers:
          Subject: '[ReportCollector] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        html: |
          <h3>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})</h3>
          {{ range .Alerts }}
          <p><strong>{{ .Annotations.summary }}</strong></p>
          <p>{{ .Annotations.description }}</p>
          {{ end }}
          <p>Дашборды: <a href="http://localhost:3000">Grafana</a> ·
             <a href="http://localhost:9090/alerts">Prometheus</a> ·
             <a href="http://localhost:9093">Alertmanager</a></p>
