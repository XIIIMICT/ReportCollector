# Локальные внешние сервисы: PostgreSQL, Keycloak, Loki и Grafana.
# Запускаются отдельно от приложения через профиль standalone:
#   just db-standalone / just keycloak-standalone / just logging-standalone
#
# Приложение (профили prod/dev) рассчитано на внешние PostgreSQL, Keycloak и Loki,
# поэтому эти контейнеры не должны запускаться вместе с ним.

services:
  postgres:
    container_name: rc-postgres
    image: postgres:18-alpine
    profiles: [standalone]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Нужно указать POSTGRES_USER в окружении или .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Нужно указать POSTGRES_PASSWORD в окружении или .env}
      POSTGRES_DB: ${POSTGRES_DB:?Нужно указать POSTGRES_DB в окружении или .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net, net-dev]

  keycloak:
    container_name: rc-keycloak
    image: keycloak/keycloak:26.6
    profiles: [standalone]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://127.0.0.1:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Параметры OIDC-клиента приложения (совпадают с дефолтами кода; редко меняются).
      AUTH_KEYCLOAK_SCOPES: openid profile email
      AUTH_KEYCLOAK_SIGNING_ALGORITHMS: RS256
      AUTH_KEYCLOAK_TOKEN_ENDPOINT_AUTH_METHOD: client_secret_basic
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [net, net-dev]

  loki:
    container_name: rc-loki
    image: grafana/loki:3.7
    profiles: [standalone]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [net, net-dev]
    ports:
      - "3100:3100"

  prometheus:
    container_name: rc-prometheus
    image: prom/prometheus:v3.6.0
    profiles: [standalone]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days of raw samples at a 15s scrape: enough to compare "now" against
      # "last week" and to re-evaluate an incident, without the disk growing
      # forever. Retention is the metrics counterpart of Loki's.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    # Same resolution as Alloy: the Linux Docker daemon does not provide
    # `host.docker.internal` on its own.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [net, net-dev]
    ports:
      - "9090:9090"

  alertmanager:
    container_name: rc-alertmanager
    image: prom/alertmanager:v0.28.1
    profiles: [standalone]
    restart: unless-stopped
    environment:
      SUPPORT_MAIL: ${SUPPORT_MAIL:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./alertmanager/alertmanager.tpl.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [net, net-dev]
    ports:
      - "9093:9093"

  grafana:
    container_name: rc-grafana
    image: grafana/grafana:13.1-slim
    profiles: [standalone]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Нужно указать GF_SECURITY_ADMIN_USER в окружении или .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Нужно указать GF_SECURITY_ADMIN_PASSWORD в окружении или .env}
      GF_USERS_DEFAULT_THEME: dark
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks: [net]
    ports:
      - "3000:3000"

  valkey:
    container_name: rc-valkey
    image: valkey/valkey:9-alpine
    profiles: [standalone]
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "no"]
    networks: [net, net-dev]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: rc-postgres-data
  loki-data:
    name: rc-loki-data
  grafana-data:
    name: rc-grafana-data
  prometheus-data:
    name: rc-prometheus-data
  alertmanager-data:
    name: rc-alertmanager-data
