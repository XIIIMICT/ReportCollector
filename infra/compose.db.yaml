# Сервисы данных: PostgreSQL и Valkey (единый стандарт compose-файлов;
# в excel_loader — только Postgres, в ReportCollector — Postgres и Valkey;
# Keycloak — отдельно в compose.auth.yaml). Запускаются отдельно от
# приложения через `just db-stand`. Зависимости: postgres → keycloak (auth).
#
# Приложение (профили prod/dev) рассчитано на внешний PostgreSQL и Loki,
# поэтому эти контейнеры не должны запускаться вместе с ним.
# Наблюдательный стек (alloy + loki/grafana/prometheus/alertmanager)
# живёт в infra/compose.monitoring.yaml; proxy — в infra/compose.proxy.yaml.

services:
  postgres:
    container_name: rc-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Значения из .env; приложение читает их через переменные POSTGRES_*.

      POSTGRES_USER: ${POSTGRES_USER:?Нужно указать POSTGRES_USER в окружении или .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Нужно указать POSTGRES_PASSWORD в окружении или .env}
      POSTGRES_DB: ${POSTGRES_DB:?Нужно указать POSTGRES_DB в окружении или .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    # Host-side admin only (just migrate/seeds). Containers use the service
    # name on `net`/`net-dev`; never expose the database on all interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net, net-dev]

  valkey:
    container_name: rc-valkey
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "no"]
    networks: [net, net-dev]
    # Container-to-container only (back-dev uses `redis://valkey:6379/0`).
    # No host publication: host-side checks use the isolated CI stand's
    # loopback 16379 port instead.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Logical backup sidecar: daily pg_dump into a dedicated volume, weekly
  # restore drill into a scratch DB. Deliberately NOT in `just db-stand`'s
  # explicit service list — start it with `just backup-stand` (or on prod with
  # the same service name). No host port: Prometheus scrapes it on `net`.
  pgbackup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: rc-pgbackup
    restart: unless-stopped
    environment:
      # Inside compose use the postgres service name; for an external prod DB
      # set POSTGRES_HOST_DOCKER to its address (same escape hatch as `back`).
      POSTGRES_HOST: ${POSTGRES_HOST_DOCKER:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?Нужно указать POSTGRES_USER в окружении или .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Нужно указать POSTGRES_PASSWORD в окружении или .env}
      POSTGRES_DB: ${POSTGRES_DB:?Нужно указать POSTGRES_DB в окружении или .env}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:?Нужно указать POSTGRES_SCHEMA в окружении или .env}
      BACKUP_DIR: /var/backups/reportcollector
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_DRILL_WEEKDAY: ${BACKUP_DRILL_WEEKDAY:-6}
      BACKUP_DRILL_HOUR_UTC: ${BACKUP_DRILL_HOUR_UTC:-3}
      # Optional: a command template with one `{file}` token, e.g.
      # `aws s3 cp {file} s3://bucket/prefix/` or `rsync -a {file} host:/dir/`.
      # Empty means the off-host requirement is NOT satisfied; see docs/RUNBOOKS.md.
      BACKUP_OFFHOST_TARGET: ${BACKUP_OFFHOST_TARGET:-}
      BACKUP_METRICS_PORT: "9113"
    volumes:
      - postgres-backups:/var/backups/reportcollector
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9113/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [net]

volumes:
  postgres-data:
    name: rc-postgres-data
  postgres-backups:
    name: rc-postgres-backups
