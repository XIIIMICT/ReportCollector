# Наблюдательный стек ReportCollector (единый стандарт compose-файлов):
#   логи    — Alloy (stateless, без профиля) → Loki → Grafana;
#   метрики — Prometheus (скрейпит бэкенд ReportCollector по /metrics,
#            JOB reportcollector-back) и Alertmanager (почта).
#
# Сервисы без профиля: alloy запускается всегда (`just monitoring` — только он,
# против внешнего Loki), loki/grafana/prometheus/alertmanager — по запросу
# (`just monitoring-stand` — весь стек). На сервере эти сервисы предоставляет
# центральный стек DWH infra/compose.monitoring.yaml; конфиги Loki и Alertmanager
# здесь остаются source of truth для его копий (дрейф проверяется отдельно).

services:
  # Без профиля: логи собираются и в prod, и в dev.
  alloy:
    container_name: rc-alloy
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345]
    environment:
      # Локальный стек: http://loki:3100 (имя сервиса этого проекта); на
      # сервере — центральный Loki (host.docker.internal:3100 или адрес сервера).
      LOKI_URL: ${LOKI_URL:?Нужно указать LOKI_URL в окружении или .env}
      # Лейбл env на всех логах (sys.env("LOG_ENV") в config.alloy): local для
      # локального стека, prod — на сервере.
      LOG_ENV: ${LOG_ENV:-local}
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/reportcollector:ro
    networks: [net, net-dev]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "12345:12345"

  loki:
    container_name: rc-loki
    image: grafana/loki:3.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [net, net-dev]
    ports:
      - "3100:3100"

  prometheus:
    container_name: rc-prometheus
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days of raw samples at a 15s scrape: enough to compare "now" against
      # "last week" and to re-evaluate an incident, without the disk growing
      # forever. Retention is the metrics counterpart of Loki's.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    # Same resolution as Alloy: the Linux Docker daemon does not provide
    # `host.docker.internal` on its own.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [net, net-dev]
    ports:
      - "9090:9090"

  alertmanager:
    container_name: rc-alertmanager
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      SUPPORT_MAIL: ${SUPPORT_MAIL:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./alertmanager/alertmanager.tpl.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [net, net-dev]
    ports:
      - "9093:9093"

  grafana:
    container_name: rc-grafana
    image: grafana/grafana:13.1-slim
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Нужно указать GF_SECURITY_ADMIN_USER в окружении или .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Нужно указать GF_SECURITY_ADMIN_PASSWORD в окружении или .env}
      GF_USERS_DEFAULT_THEME: dark
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks: [net]
    ports:
      - "3000:3000"

volumes:
  loki-data:
    name: rc-loki-data
  grafana-data:
    name: rc-grafana-data
  prometheus-data:
    name: rc-prometheus-data
  alertmanager-data:
    name: rc-alertmanager-data
