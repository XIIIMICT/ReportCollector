# Prometheus scrape configuration.
#
# The application is NOT part of the `standalone` profile: `just monitoring` brings
# up the observability stack while the backend runs under `just dev` / `just
# prod`. Prometheus therefore reaches it through the host gateway, exactly like
# Alloy reaches Loki (`LOKI_URL=http://host.docker.internal:3100` in `.env`).
#
# Add the backend of a real deployment here as another target; the job name
# becomes the `job` label every series carries.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: reportcollector-back
    metrics_path: /metrics
    static_configs:
      # The backend port is fixed here rather than templated: Prometheus'
      # config does not expand `${VAR}` from the compose environment. `just dev`
      # and `just prod` both serve the backend on BACKEND_PORT from `.env`
      # (8000 by default), and Prometheus reaches the host over the gateway.
      - targets: ["host.docker.internal:8000"]
        labels:
          env: local

  # Prometheus scraping itself: confirms the collector is alive and gives
  # `up{job="prometheus"}` as a sanity series in every dashboard.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
