# Alerting rules for ReportCollector.
#
# Failure and hard-capacity signals plus provisional event-loop/disk warnings.
# The latter are operational guardrails, not accepted SLOs. Calibrate them and
# add workload-specific latency/backlog/memory rules after the load baseline in
# Thresholds marked provisional must be calibrated with the workload matrix in
# `docs/TODO.md` before production rollout. Preserve instance labels on capacity comparisons.

groups:
  - name: reportcollector-http
    interval: 30s
    rules:
      # A 5xx means the server broke on a request that was otherwise valid.
      # A single one is worth a look but not a page (a user may have hit a
      # genuinely broken row); a sustained rate is unambiguously bad.
      - alert: BackendServerErrors
        expr: |
          sum(rate(http_requests_total{job="reportcollector-back",status=~"5.."}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Бэкенд отвечает 5xx ({{ $value | printf \"%.2f\" }} ошибок/с)"
          description: >-
            Более 0,05 серверных ошибок в секунду в течение 2 минут.
            Откройте дашборд «ReportCollector · Ошибки», найдите request_id
            и посмотрите стектрейс.

      # Surface a single failed request promptly. The sustained rule above is
      # intentionally conservative, but an export failure must be actionable
      # even when traffic is low.
      - alert: BackendServerErrorImmediate
        # A timestamp catches the first failure of a new route as well.
        # increase() alone misses counters first scraped with value 1.
        expr: |
          http_last_failure_timestamp_seconds{job="reportcollector-back"} > 0
          and time() - http_last_failure_timestamp_seconds{job="reportcollector-back"} < 300
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Серверная ошибка или прерванный ответ"
          description: >-
            Найдите request_id в логах и проверьте маршрут, особенно если это
            была выгрузка или импорт.

      # Any 5xx at all, seen over a longer window: catches a low, steady leak
      # (one broken endpoint someone uses rarely) that the rate rule ignores.
      - alert: BackendServerErrorsPersisting
        expr: |
          sum(increase(http_requests_total{job="reportcollector-back",status=~"5.."}[1h])) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} ответов 5xx за час"
          description: >-
            Ошибки не взрывные, но постоянные — скорее всего один сломанный
            маршрут. Смотрите панель «Самые медленные маршруты» и логи по
            level="ERROR".

      # Without this, a scrape that stops entirely (backend down, port closed)
      # looks exactly like a healthy system: no 5xx, because no requests.
      - alert: BackendUnreachable
        expr: up{job="reportcollector-back"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus не может достучаться до бэкенда"
          description: >-
            Контейнер упал, порт не проброшен или /metrics недоступен.
            Запущено ли приложение вообще?

      # Collaboration-specific: a client whose queue fills is dropped and
      # reconnects SILENTLY — nothing errors, so no 5xx rule fires. At scale
      # this is the first sign the real-time layer cannot keep up.
      - alert: CollaborationSlowConsumers
        expr: |
          sum(increase(ws_slow_consumers_total[10m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "Клиенты не успевают получать события ({{ $value | printf \"%.0f\" }})"
          description: >-
            За 10 минут отброшено более 5 соединений по переполнению очереди.
            Пользователи видят «не обновляется» и переподключаются.
            Смотрите дашборд «Сотрудничество».

      - alert: DatabasePoolExhausted
        expr: |
          db_connections_in_use{job="reportcollector-back"} >= db_pool_capacity{job="reportcollector-back"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Пул PostgreSQL работает на пределе"
          description: >-
            Все доступные соединения заняты (включая разрешённый overflow). Проверьте
            ожидание пула, длительные транзакции и фоновые импорты/выгрузки.

      - alert: DatabaseQueryTimeouts
        expr: |
          sum(increase(db_query_failures_total{reason=~"statement_timeout_or_cancel|lock_timeout|deadlock"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL прерывает запросы по таймауту или блокировке"
          description: >-
            Разберите slow-query/lock wait и состояние импорта. Счётчик уже
            разделяет statement timeout, lock timeout и deadlock.

      - alert: ExportJobsFailing
        expr: |
          sum(increase(export_jobs_failed_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Сбой Excel-выгрузки"
          description: >-
            Посмотрите structured log по job_id и фазу generate; клиент увидит
            стабильную ошибку вместо бесконечного ожидания.

      - alert: EventLoopBlocked
        expr: |
          histogram_quantile(0.95, rate(runtime_event_loop_lag_seconds_bucket[10m])) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event loop регулярно блокируется"
          description: >-
            CPU-heavy импорт, экспорт или синхронная операция выполняется в
            процессе API. Проверьте RSS/CPU и очередь фоновых заданий.

      - alert: BackendDiskPressure
        expr: |
          runtime_disk_free_bytes{job="reportcollector-back"} < 5368709120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Заканчивается место для логов или Excel-файлов"
          description: >-
            Освободите файловую систему или уменьшите TTL артефактов до того,
            как запись логов/выгрузок начнёт падать.

      - alert: BackendDependencyFailing
        expr: |
          sum by (job, instance, dependency) (increase(dependency_check_duration_seconds_count{outcome="error"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Readiness фиксирует сбой зависимости {{ $labels.dependency }}"
          description: >-
            Приложение отвечает, но проверка PostgreSQL или Valkey не проходит.
            Проверьте доступность зависимости и ожидание соединений.

      - alert: ValkeySubscriptionsFailing
        expr: increase(valkey_subscription_failures_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Обрывается подписка совместного редактирования"
          description: >-
            Valkey pub/sub завершился ошибкой после повторов клиента.
            Сопоставьте время с WS close code и логами transport unavailable.

  - name: reportcollector_monitoring_stack
    # Unique project prefix: every project's rule file is copied into the
    # central DWH rules/ directory, where generic names would collide.
    rules:
      - alert: ReportCollectorPrometheusSelfScrapeDown
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ReportCollector: Prometheus не скрапит себя"
          description: "Санити-серия up. Дашборд «ReportCollector · Сервис», Prometheus → /alerts."

      - alert: ReportCollectorLokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ReportCollector: Loki недоступен"
          description: "Alloy некуда слать логи; приложение продолжает работать. Смотрите «ReportCollector · Ошибки» и Grafana → Explore, correlate by request_id."

      - alert: ReportCollectorAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ReportCollector: Alertmanager недоступен"
          description: "Письма не уйдут; алерты видны в Prometheus → /alerts."

      - alert: ReportCollectorGrafanaDown
        expr: up{job="grafana"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ReportCollector: Grafana недоступна"
          description: "Дашборды «ReportCollector · Сервис/Ошибки/Сотрудничество» недоступны; логи по-прежнему в Loki."

  # PostgreSQL backups. The age gauges are computed by the sidecar at scrape
  # time, so no `time()` arithmetic is needed here and promtool can test them
  # with constant series. The exporter has no host publication: scrape by the
  # `reportcollector-pg-backup` job only. Names/labels are documented in
  # docs/RUNBOOKS.md, «Monitoring contract».
  - name: reportcollector_pg_backup
    interval: 30s
    rules:
      - alert: PgBackupExporterDown
        expr: up{job="reportcollector-pg-backup"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ReportCollector: сервис backup-а недоступен"
          description: >-
            Prometheus не скрапит pgbackup. Проверьте контейнер и сеть net;
            пока он не работает, бекапы и drills не выполняются.

      - alert: PgBackupFailed
        expr: increase(pg_backup_runs_total{outcome="failure",job="reportcollector-pg-backup"}[6h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Не удалось сделать бекап PostgreSQL"
          description: >-
            pg_dump, проверка дампа, retain или off-host копирование вернули
            ненулевой код. Смотрите метрику pg_backup_last_failure_timestamp_seconds
            по label operation и причину в логах контейнера pgbackup.

      - alert: PgBackupOverdue
        # 25 h = daily schedule (RPO <= 24 h) plus one hour of slack.
        expr: pg_backup_last_success_age_seconds{job="reportcollector-pg-backup"} > 90000
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Нет успешного бекапа PostgreSQL более 25 часов"
          description: >-
            Нарушено принятое RPO ≤ 24 ч. Выполните `just backup-now`, проверьте
            доступность PostgreSQL и free space в volume rc-postgres-backups.
            Процедура — docs/RUNBOOKS.md.

      - alert: PgRestoreDrillFailed
        expr: pg_backup_drill_last_failure_age_seconds{job="reportcollector-pg-backup"} < 86400
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Репетиция восстановления PostgreSQL провалилась"
          description: >-
            pg_restore в scratch-БД или проверка alembic_version не прошли.
            Бекап может быть невосстанавливаемым: разберитесь до следующего
            запланированного drill и повторите `just backup-drill`.

      - alert: PgRestoreDrillOverdue
        # Weekly cadence (7 d) plus one day of slack.
        expr: pg_backup_drill_last_success_age_seconds{job="reportcollector-pg-backup"} > 691200
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Нет успешной репетиции восстановления более 8 дней"
          description: >-
            Еженедельный drill не выполнялся. Проверьте, что pgbackup запущен
            и что роль postgres может создавать/удалять scratch-БД (CREATEDB).
