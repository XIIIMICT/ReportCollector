name: Tests

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, dev]
    paths:
      - "back/**"
      - "front/**"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "back/**"
      - "front/**"
      - ".github/workflows/test.yaml"

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-secret-for-testing-at-least-32-bytes-long
  BACKEND_CORS_ORIGINS: '["http://localhost:5000","http://127.0.0.1:5000"]'

jobs:
  back:
    name: Back — pytest (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: strong_password
          POSTGRES_DB: dwh
        options: >-
          --health-cmd "pg_isready -U postgres -d dwh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest -v --cov=src --cov-report=term-missing
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: strong_password
          POSTGRES_DB: dwh
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_SCHEMA: rc_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:strong_password@localhost:5432/dwh
          TEST_SCHEMA: rc_test

  front:
    name: Front — bun test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('front/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
