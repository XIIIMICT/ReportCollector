name: Load baseline (on demand)

# Manual-only: never a required per-PR check. Run against a disposable CI stand
# built from this commit; docs/LOAD-BASELINE.md records the local baseline and
# docs/LOAD-PROFILES.md marks every capacity target as an ASSUMPTION.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: k6 script to run (all runs the five workload scripts)
        required: true
        default: all
        type: choice
        options:
          - all
          - join-leave-storm
          - steady-edit
          - presence-scale
          - undo-burst
          - reconnect-resync
      vus:
        description: Scaled-down VU count (the 300-client target is unmeasured)
        required: true
        default: "20"
        type: string
      duration:
        description: Duration per k6 scenario
        required: true
        default: 30s
        type: string

permissions:
  contents: read

concurrency:
  group: load-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-stand-only credential, generated per run. Never a production secret and
  # never written to a repo file or artifact. Four reserved .test users are
  # created by the seed with RC_SEED_E2E_FIXTURES=1.
  E2E_TEST_PASSWORD: ${{ format('e2e-{0}', github.run_id) }}
  RC_FRONT_URL: http://127.0.0.1:15000
  RC_WS_URL: ws://127.0.0.1:18000/api/ws/raw-materials
  RC_VUS: ${{ inputs.vus }}
  RC_DURATION: ${{ inputs.duration }}
  K6_IMAGE: grafana/k6:2.4.0

jobs:
  baseline:
    name: k6 on the isolated stand
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      - name: Build isolated images
        run: |
          docker build --target prod -t rc-back:ci ./back
          docker build --target prod -t rc-front:ci ./front

      - name: Initialize isolated database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci_password@127.0.0.1:15432/rc_ci
          POSTGRES_SCHEMA: rc
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          docker compose -f infra/compose.ci.yaml up -d --wait --wait-timeout 120 postgres valkey
          uv sync --directory back --locked --no-dev
          # Migration 0035 needs the external dict schema; seed it first.
          uv run --directory back --no-sync python -m src.scripts.seed_dev_dict --yes
          uv run --directory back --no-sync python -m migrations.upgrade
          docker compose -f infra/compose.ci.yaml run --rm --no-deps \
            -e RC_SEED_E2E_FIXTURES=1 \
            -e E2E_TEST_PASSWORD="$E2E_TEST_PASSWORD" \
            back python -m src.scripts.seed_database --data-only
          docker compose -f infra/compose.ci.yaml up -d --no-build --wait --wait-timeout 120 back front

      - name: Run k6 suite
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          mkdir -p k6-reports
          if [ "$SCENARIO" = "all" ]; then
            scripts="join-leave-storm steady-edit presence-scale undo-burst reconnect-resync"
          else
            scripts="$SCENARIO"
          fi
          for script in $scripts; do
            echo "::group::k6 $script"
            docker run --rm --network host \
              -v "$PWD:/repo:ro" -w /repo \
              -e RC_FRONT_URL -e RC_WS_URL -e RC_VUS -e RC_DURATION \
              -e E2E_TEST_PASSWORD \
              "$K6_IMAGE" run "load/$script.js" 2>&1 | tee "k6-reports/$script.log"
            echo "::endgroup::"
          done

      - name: Collect container logs
        if: always()
        run: docker compose -f infra/compose.ci.yaml logs --no-color > k6-reports/container-logs.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-load-baseline
          path: k6-reports
          retention-days: 7

      - name: Stop isolated stack
        if: always()
        run: docker compose -f infra/compose.ci.yaml down --volumes --remove-orphans
