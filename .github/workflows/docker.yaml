name: Docker CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, dev]
    paths:
      - "back/**"
      - "front/**"
      - "compose.yaml"
      - "infra/**"
      - ".env.example"
      - ".github/workflows/docker.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "back/**"
      - "front/**"
      - "compose.yaml"
      - "infra/**"
      - ".env.example"
      - ".github/workflows/docker.yaml"

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: back
            context: ./back
            target: prod
          - name: front
            context: ./front
            target: prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}-ci
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-ci

  compose-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=ci_password" >> .env
          echo "POSTGRES_DB=postgres" >> .env
          echo "POSTGRES_SCHEMA=rc" >> .env
          echo "AUTH_SECRET=ci-secret-for-testing-at-least-32-bytes" >> .env
          echo "AUTH_APP_ORIGIN=http://127.0.0.1:5000" >> .env
          echo "KEYCLOAK_ENABLED=false" >> .env

      - name: Start production stack
        run: docker compose --profile prod up -d --build postgres back front

      - name: Wait for backend healthcheck
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6000/health; then
              echo ""
              exit 0
            fi
            sleep 3
          done
          echo "Backend healthcheck timeout"
          docker compose --profile prod logs back
          exit 1

      - name: Wait for frontend healthcheck
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              echo ""
              exit 0
            fi
            sleep 3
          done
          echo "Frontend healthcheck timeout"
          docker compose --profile prod logs front
          exit 1

      - name: Verify API endpoints
        run: |
          curl --fail --silent http://127.0.0.1:6000/health | grep -q '"ok"'
          curl --fail --silent http://127.0.0.1:5000/api/health | grep -q '"ok"'
          echo "All endpoints OK"

      - name: Stop stack
        if: always()
        run: docker compose --profile prod down -v