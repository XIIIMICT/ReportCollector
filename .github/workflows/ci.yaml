name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  config:
    name: Workflow and Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Validate Compose
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: rc_ci
          POSTGRES_SCHEMA: rc
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          cp .env.example .env
          docker compose --profile prod --profile dev config --quiet
          docker compose -f infra/compose.ci.yaml config --quiet
      - name: Validate alert rules and dashboard JSON
        # The backup alerts and the provisioned panel are part of the same
        # change as the sidecar. Test the rules with the same promtool version
        # the monitoring container ships, so a broken expression cannot merge.
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/rules" -w /rules prom/prometheus:v3.6.0 check rules alert-rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/rules" -w /rules prom/prometheus:v3.6.0 test rules alert-rules.test.yml
          python3 -m json.tool infra/grafana/provisioning/dashboards-json/service.json > /dev/null
      - name: Reject host-wide port publications
        # Parses rendered `docker compose config --format json`, so includes,
        # profiles and ${VAR} expansion are already applied. The unit tests
        # cover positive, negative and allow-list cases without Docker.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: rc_ci
          POSTGRES_SCHEMA: rc
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          python3 -m unittest discover -s infra -p 'test_*.py'
          python3 infra/check_host_binds.py

  back:
    name: Backend (${{ matrix.store }})
    strategy:
      fail-fast: false
      matrix:
        store: [memory, valkey]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    env:
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strong_password
      POSTGRES_DB: dwh
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SCHEMA: rc_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:strong_password@localhost:5432/dwh
      TEST_SCHEMA: rc_test
      VALKEY_URL: ""
      TEST_VALKEY_URL: redis://127.0.0.1:6379/15
      TEST_COLLAB_BACKEND: ${{ matrix.store }}
      TEST_VALKEY_RESET: "1"
      COVERAGE_FILE: coverage-data
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: strong_password
          POSTGRES_DB: dwh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dwh"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check
      - name: Test API, migrations and Valkey
        run: uv run --no-sync pytest -q --cov=src --cov-branch --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml --durations=10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports-${{ matrix.store }}
          path: |
            back/coverage.xml
            back/test-results.xml
            back/coverage-data
          retention-days: 7

  openapi-contract:
    name: OpenAPI contract freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - run: uv sync --locked
        working-directory: back
      - uses: oven-sh/setup-bun@v2
        with:
          # Same exact pins as the front job: generator output must be stable.
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
        working-directory: front
      - run: bun run gen:openapi --check
        working-directory: front

  coverage:
    name: Combined backend coverage
    needs: back
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - uses: actions/download-artifact@v8
        with:
          pattern: backend-reports-*
          path: back/store-reports
      - run: uv sync --locked
      - name: Require a report from EVERY store
        # `upload-artifact` runs with `if: always()`, so a failed matrix leg still
        # uploads a partial report. Combining whatever arrived would then report a
        # healthy percentage for half the codebase — the number must not lie.
        run: |
          for store in memory valkey; do
            test -f "store-reports/backend-reports-$store/coverage-data" || {
              echo "::error::missing coverage for the $store store — the matrix leg failed or uploaded nothing"
              exit 1
            }
          done
      - name: Require coverage across both transport implementations
        run: |
          uv run --no-sync coverage combine store-reports/backend-reports-memory/coverage-data store-reports/backend-reports-valkey/coverage-data
          uv run --no-sync coverage report --fail-under=80
          uv run --no-sync coverage xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-combined
          path: back/coverage.xml
          retention-days: 7

  front:
    name: Frontend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Exact pin: the floating "1.4" resolved to 1.4.5 in CI while the
          # green local suite runs on 1.4.4. Coverage and Playwright must not
          # depend on whichever patch release happens to be latest.
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - name: Discover smoke e2e specs
        # The smoke project's testMatch is the source of truth. Fail if a
        # required spec disappears; never assert an exact test count and never
        # involve the Keycloak project (which CI does not prepare).
        run: |
          bunx --no-install playwright test --project=smoke --list | tee smoke-discovery.txt
          for spec in auth clipboard collab fix-month health hover-dropdown raw-materials-ui renovation-hover smoke workspace-panels; do
            # Anchor on the discovery prefix and the trailing colon: a bare
            # filename match would let an unrelated "*-$spec.spec.ts" satisfy
            # the guard while the required spec disappeared.
            grep -Fq "› $spec.spec.ts:" smoke-discovery.txt || {
              echo "::error::required smoke spec $spec.spec.ts is absent from the Playwright discovery list"
              exit 1
            }
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-discovery
          path: front/smoke-discovery.txt
          retention-days: 7
      - run: bunx --no-install next typegen
      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run format:check
      - name: Unit tests with a coverage floor
        # `bun test` has no --coverage-threshold; `test:coverage` runs the LCOV
        # report through scripts/coverage-gate.ts, which enforces the floor.
        run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: front/coverage
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The FULL history: a secret that was committed and then deleted is
          # still in every clone, so a shallow scan would miss exactly the leak
          # that matters most.
          fetch-depth: 0
      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are reported, not silently ignored: no GITLEAKS_CONFIG, no
          # allowlist file — a false positive is fixed in .gitleaks.toml with a
          # reason, never by lowering the gate.
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  production:
    name: Production images and browser smoke
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://127.0.0.1:15000
      # Isolated-stand-only credential, generated per run. Shared by the seed
      # step and the browser smoke step; never a production secret and never
      # written to a repo file or an artifact. No AUTH_SEED_ADMIN_* is passed:
      # local-auth smoke tests use only the reserved user1..user4@test.local
      # accounts created by the seed.
      E2E_TEST_PASSWORD: ${{ format('e2e-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Exact pin: the floating "1.4" resolved to 1.4.5 in CI while the
          # green local suite runs on 1.4.4. Coverage and Playwright must not
          # depend on whichever patch release happens to be latest.
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: docker/setup-buildx-action@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: ./back
          target: prod
          load: true
          tags: rc-back:ci
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back
      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: ./front
          target: prod
          load: true
          tags: rc-front:ci
          # The Turbopack build is memory-hungry; the runner killed it with SIGKILL
          # ("cannot allocate memory"). An explicit V8 ceiling makes it collect
          # early instead of growing until the OOM killer wins.
          build-args: |
            NODE_OPTIONS=--max-old-space-size=3072
          # `mode=max` keeps the intermediate `deps`/`build` layers as well as the
          # final image, which is what makes a warm run skip `bun install`.
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
      - name: Initialize isolated database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci_password@127.0.0.1:15432/rc_ci
          POSTGRES_SCHEMA: rc
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          docker compose -f infra/compose.ci.yaml up -d --wait --wait-timeout 120 postgres valkey
          uv sync --directory back --locked --no-dev
          # «Ставки» (migration 0035) has FOREIGN KEYs into the corporate
          # `dict` schema, which no migration creates. On this isolated CI
          # database, seed the five demo dictionary tables BEFORE upgrading —
          # the same fixture `just seed-dev-dict` uses for a developer's DB.
          uv run --directory back --no-sync python -m src.scripts.seed_dev_dict --yes
          uv run --directory back --no-sync python -m migrations.upgrade
          # Opt in to the reserved .test users and the deterministic archive /
          # work-code fixtures. The flag is never set in production; the
          # password is passed from this job's env, not stored in the repo.
          docker compose -f infra/compose.ci.yaml run --rm --no-deps \
            -e RC_SEED_E2E_FIXTURES=1 \
            -e E2E_TEST_PASSWORD="$E2E_TEST_PASSWORD" \
            back python -m src.scripts.seed_database --data-only
          # The КППК merge/export spec needs a non-empty realization grid,
          # which comes from the period rows; the base seed owns only «Сырьё»
          # and the renovation plan. On a clean database the script creates the
          # `raw.kppk_*` sources from its demo rows, then the periods.
          docker compose -f infra/compose.ci.yaml run --rm --no-deps back python -m src.scripts.seed_kppk
      - name: Start tested production images
        run: docker compose -f infra/compose.ci.yaml up -d --no-build --wait --wait-timeout 120 back front
      - name: Install browser
        working-directory: front
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright install --with-deps chromium
      - name: Browser smoke
        run: bun run --cwd front test:e2e --project=smoke
      - name: Export tested release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save -o production-images.tar rc-back:ci rc-front:ci
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: production-images
          path: production-images.tar
          retention-days: 1
          compression-level: 0
      - name: Collect container logs
        if: always()
        run: docker compose -f infra/compose.ci.yaml logs --no-color > container-logs.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-and-container-reports
          path: |
            front/playwright-report
            front/test-results
            container-logs.txt
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: docker compose -f infra/compose.ci.yaml down --volumes --remove-orphans

  required:
    name: CI required
    if: always()
    needs: [config, back, coverage, front, openapi-contract, secrets, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
