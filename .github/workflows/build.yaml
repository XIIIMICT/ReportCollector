name: Build

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, dev]
    paths:
      - "back/**"
      - "front/**"
      - ".github/workflows/build.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "back/**"
      - "front/**"
      - ".github/workflows/build.yaml"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back — compileall
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Compile Python sources
        run: uv run --no-dev -m compileall src

  front:
    name: Front — Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('front/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js
        run: bun run build
        env:
          KEYCLOAK_ENABLED: "false"
          AUTH_SECRET: ci-secret-for-build-placeholder-at-least-32-bytes
          AUTH_APP_ORIGIN: http://localhost:5000
          BACKEND_INTERNAL_URL: http://localhost:8000
