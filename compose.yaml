name: reportcollector

include:
  - path: ./infra/compose.external-services.yaml
  - path: ./infra/compose.alloy.yaml

services:
  back:
    profiles: [prod]
    container_name: rc-back
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      LOG_FILE: /app/logs/reportcollector.log
      AUTH_KEYCLOAK_INTERNAL_ISSUER: ${AUTH_KEYCLOAK_DOCKER_INTERNAL_ISSUER:-${AUTH_KEYCLOAK_PUBLIC_ISSUER}}
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  back-dev:
    profiles: !override [dev]
    extends: back
    container_name: rc-back-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
        - action: rebuild
          path: ./back/pyproject.toml
        - action: rebuild
          path: ./back/uv.lock

  front:
    profiles: [prod]
    container_name: rc-front
    build:
      context: ./front
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      BACKEND_INTERNAL_URL: http://back:3000
      AUTH_KEYCLOAK_INTERNAL_ISSUER: ${AUTH_KEYCLOAK_DOCKER_INTERNAL_ISSUER:-${AUTH_KEYCLOAK_PUBLIC_ISSUER}}
      FRONT_LOG_FILE: /app/logs/reportcollector-front.log
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 5000) + '/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  front-dev:
    profiles: !override [dev]
    extends: front
    container_name: rc-front-dev
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
    depends_on: !override
      back-dev:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://back-dev:3000
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./front/src
          target: /app/src
        - action: sync
          path: ./front/public
          target: /app/public
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/bun.lock
        - action: rebuild
          path: ./front/next.config.ts
        - action: rebuild
          path: ./front/postcss.config.ts
        - action: rebuild
          path: ./front/tsconfig.json

networks:
  net:
    name: rc-net
  net-dev:
    name: rc-net-dev
