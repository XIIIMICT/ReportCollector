name: reportcollector

include:
  - path: ./infra/compose.proxy.yaml
  - path: ./infra/compose.db.yaml
  - path: ./infra/compose.auth.yaml
  - path: ./infra/compose.monitoring.yaml

# ── Единые источники ─────────────────────────────────────────────────────────
# Порт бэкенда и фронтенда задаются один раз в корневом .env (BACKEND_PORT /
# FRONT_PORT) и отсюда же расходятся: ARG в Dockerfile (порт в контейнере),
# проброс портов, healthcheck, внутренние URL. Аналогично хост бэкенда
# (имя сервиса в compose-сети) и хост приложения (AUTH_APP_ORIGIN), из
# которого выводится список CORS-ориджинов. Все они обязательные (:? — при
# отсутствии compose падает с понятной ошибкой, а не молча подставляет дефолт).
services:
  back:
    profiles: [prod]
    container_name: rc-back
    # Bind-папки ./logs (и /app/logs) принадлежат на Linux пользователю, от
    # которого снят деплой: запускаем контейнер с его UID/GID, чтобы файлы
    # логов не рождались root'ом и не ломали права. В .env задаются ОБЕ
    # HOST_UID/HOST_GID (`id -u` / `id -g`).
    #
    # Значения по умолчанию здесь НЕТ намеренно. Подставленное число действует
    # и в Docker Desktop (вопреки прежнему комментарию: директива user работает
    # везде, просто не отображается на Windows-ACL), а образы рассчитаны на
    # СВОИХ пользователей — back на appuser (100:101), front на root. Чужой UID
    # 1000 не мог ни дописать /app/logs/reportcollector.log (PermissionError),
    # ни создать /app/.next (EACCES), и `just dev` падал на старте обоих
    # контейнеров. Форма `:+` при пустых переменных не подставляет НИЧЕГО —
    # compose отбрасывает ключ, и контейнер идёт под пользователем образа, как
    # и нужно на Windows / в Docker Desktop. Простая `${HOST_UID:-}:${HOST_GID:-}`
    # так не работает: она даёт литерал `:` и падает.
    user: "${HOST_UID:+${HOST_UID}:${HOST_GID}}"
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
      args:
        BACKEND_PORT: ${BACKEND_PORT:?}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      LOG_FILE: /app/logs/reportcollector.log
      # В контейнере .env-значение POSTGRES_HOST (`localhost` для хостового
      # запуска) указывает на сам контейнер: /health отвечает 200, а каждый
      # запрос к БД падает ConnectionRefusedError → серверный компонент
      # страницы кидает 500 и Next отдаёт «Minified React error #441».
      # По умолчанию — имя сервиса rc-postgres в compose-сети net: host-порт
      # 5432 теперь слушает только 127.0.0.1 и недоступен через
      # host.docker.internal. Для внешней БД на другом хосте задайте
      # POSTGRES_HOST_DOCKER явно. Как и VALKEY_URL, значение только для
      # контейнера — .env остаётся пригодным для just back/just front/seed.
      POSTGRES_HOST: ${POSTGRES_HOST_DOCKER:-postgres}
      # Valkey has no host publication either: reach the compose service by
      # name. VALKEY_URL_DOCKER is the explicit escape hatch for an external
      # server; the .env value stays for host-side runs.
      VALKEY_URL: ${VALKEY_URL_DOCKER:-redis://valkey:6379/0}
      AUTH_KEYCLOAK_INTERNAL_ISSUER: ${AUTH_KEYCLOAK_DOCKER_INTERNAL_ISSUER:-${AUTH_KEYCLOAK_PUBLIC_ISSUER}}
      # Ориджины CORS/WS: локальные + хост приложения из AUTH_APP_ORIGIN
      # (единый источник хоста в .env). Переопределить можно явным значением.
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:5000","http://127.0.0.1:5000","${AUTH_APP_ORIGIN:?}"]}'
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host publication: browsers reach the backend only through the
    # containerized nginx (`/api/ws/` → back), and front reaches it by service
    # name on `net`. The isolated CI stack keeps its own loopback 18000 port.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:?}/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  back-dev:
    profiles: !override [dev]
    extends: back
    container_name: rc-back-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
      args:
        BACKEND_PORT: ${BACKEND_PORT:?}
    networks: !override [net-dev]
    # Dev-стек: valkey — compose-сервис на той же сети (прямой путь, без
    # медленного host.docker.internal, который под нагрузкой даёт таймауты
    # Redis и ломает совместное редактирование). Прод (профиль prod)
    # оставляет VALKEY_URL из .env — там valkey может жить на хосте.
    environment:
      VALKEY_URL: redis://valkey:6379/0
      # Postgres тоже стоит в compose (локальный стек `just db-stand`,
      # сети net + net-dev) —
      # в контейнере .env-значение `localhost`/`host.docker.internal` не
      # работает (localhost — сам контейнер). Обращаемся по имени сервиса, как
      # к valkey; хост-запуск (just back/just front) по-прежнему берёт
      # POSTGRES_HOST из .env.
      POSTGRES_HOST: postgres
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
        - action: rebuild
          path: ./back/pyproject.toml
        - action: rebuild
          path: ./back/uv.lock

  front:
    profiles: [prod]
    container_name: rc-front
    # См. комментарий у back: UID/GID хостового пользователя ради bind-логов;
    # без HOST_UID/HOST_GID контейнер идёт под пользователем образа.
    user: "${HOST_UID:+${HOST_UID}:${HOST_GID}}"
    build:
      context: ./front
      dockerfile: Dockerfile
      target: prod
      args:
        PORT: ${FRONT_PORT:?}
        # The Turbopack build peaks over a gigabyte and, at V8's default heap
        # ceiling, spends minutes collecting garbage instead of compiling — on a
        # smaller runner it is killed outright (SIGKILL, "cannot allocate
        # memory"). CI passes 3072 for the same reason; without it here a local
        # `just prod-build` was the slow path nobody could explain.
        NODE_OPTIONS: ${NODE_OPTIONS_BUILD:---max-old-space-size=4096}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      BACKEND_INTERNAL_URL: http://${BACKEND_HOST:?}:${BACKEND_PORT:?}
      # Публичный адрес приложения — алиас AUTH_APP_ORIGIN (единый источник
      # хоста): не задавайте NEXT_PUBLIC_URL вручную.
      NEXT_PUBLIC_URL: ${AUTH_APP_ORIGIN:?}
      # Пусто = браузер идёт на тот же origin через nginx (wss://<хост>/api/ws/...),
      # который проксирует /api/ws/ на бэкенд. Задавать адрес нужно только если
      # WebSocket раздаётся с отдельного хоста/порта.
      COLLAB_WS_PUBLIC_URL: ${COLLAB_WS_PUBLIC_URL:-}
      AUTH_KEYCLOAK_INTERNAL_ISSUER: ${AUTH_KEYCLOAK_DOCKER_INTERNAL_ISSUER:-${AUTH_KEYCLOAK_PUBLIC_ISSUER}}
      FRONT_LOG_FILE: /app/logs/reportcollector-front.log
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host publication: the browser entry point is nginx 80/443 (TLS), which
    # proxies `/` to this service over `net`/`net-dev`. See docs/ARCHITECTURE.md.
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '${FRONT_PORT:?}') + '/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  front-dev:
    profiles: !override [dev]
    extends: front
    container_name: rc-front-dev
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
      args:
        PORT: ${FRONT_PORT:?}
    depends_on: !override
      back-dev:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://${BACKEND_HOST_DEV:?}:${BACKEND_PORT:?}
      # WebSocket, как и в prod, идёт через nginx (`/api/ws/`): back-dev больше
      # не публикуется на хосте. Пусто = браузер использует свой origin (wss).
      COLLAB_WS_PUBLIC_URL: ${COLLAB_WS_PUBLIC_URL:-}
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./front/src
          target: /app/src
        - action: sync
          path: ./front/public
          target: /app/public
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/bun.lock
        - action: rebuild
          path: ./front/next.config.ts
        - action: rebuild
          path: ./front/postcss.config.ts
        - action: rebuild
          path: ./front/tsconfig.json

networks:
  net:
    name: rc-net
  net-dev:
    name: rc-net-dev
