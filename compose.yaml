name: reportcollector

services:
  postgres:
    container_name: rc-postgres
    image: postgres:18-alpine
    profiles: [standalone, prod, dev]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - rc-postgres-data:/var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net, net-dev]

  keycloak:
    container_name: rc-keycloak
    image: keycloak/keycloak:26.6
    profiles: [standalone, prod, dev]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://127.0.0.1:8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [net, net-dev]

  back:
    profiles: [prod]
    container_name: rc-back
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      LOG_FILE: /app/logs/reportcollector.log
      POSTGRES_HOST: postgres
    volumes:
      - ./logs:/app/logs
      - /etc/ssl/certs:/etc/ssl/certs:ro
    ports:
      - "6000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  back-dev:
    profiles: !override [dev]
    extends: back
    container_name: rc-back-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
        - action: rebuild
          path: ./back/pyproject.toml
        - action: rebuild
          path: ./back/uv.lock

  front:
    profiles: [prod]
    container_name: rc-front
    build:
      context: ./front
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      BACKEND_INTERNAL_URL: http://back:3000
      AUTH_KEYCLOAK_INTERNAL_ISSUER: ${AUTH_KEYCLOAK_DOCKER_INTERNAL_ISSUER:-${AUTH_KEYCLOAK_PUBLIC_ISSUER}}
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
    ports:
      - "5000:5000"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 5000) + '/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  front-dev:
    profiles: !override [dev]
    extends: front
    container_name: rc-front-dev
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
    environment:
      BACKEND_INTERNAL_URL: http://back-dev:3000
    depends_on: !override
      back-dev:
        condition: service_started
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./front/src
          target: /app/src
        - action: sync
          path: ./front/public
          target: /app/public
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/bun.lock
        - action: rebuild
          path: ./front/next.config.ts
        - action: rebuild
          path: ./front/postcss.config.ts
        - action: rebuild
          path: ./front/tsconfig.json

networks:
  net:
    name: rc-net
  net-dev:
    name: rc-net-dev

volumes:
  rc-postgres-data:
    name: rc-postgres-data
