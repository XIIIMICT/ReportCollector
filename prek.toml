#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
# Versioned seed inputs; keep the size guard for every other new file.
exclude = '^docs/kppk/kppk_f_realization(_plan)?_202610160910\.sql$'

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "fix-byte-order-marker"
types = ["text"]
