#:schema https://www.schemastore.org/prek.json

orphan = true
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
files = '\.py$'
# Only the staged files: formatting the whole tree rewrites whatever another
# agent is editing and turns an unrelated commit into a merge conflict.
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
files = '\.py$'

[[repos.hooks]]
id = "ty-check"
name = "ty check"
# Shared hook policy (maintainer decision, 2026-11-25): all static checkers run
# on the staged files at commit and on the whole tree in CI. `ty` still resolves
# imports across the package, but diagnostics are limited to the staged files.
entry = "uv run ty check"
language = "system"
files = '\.py$'
require_serial = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock"
entry = "uv lock"
language = "system"
pass_filenames = false
files = '^pyproject\.toml$'
