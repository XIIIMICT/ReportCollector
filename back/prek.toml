#:schema https://www.schemastore.org/prek.json

# prek runs a nested config's hooks from ITS OWN directory, so every entry is a
# plain backend command and every `files` pattern is relative to `back/`.

orphan = true
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
files = '\.py$'
# Only the staged files: formatting the whole tree rewrites whatever another
# agent is editing and turns an unrelated commit into a merge conflict.
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
files = '\.py$'

[[repos.hooks]]
id = "ty-check"
name = "ty check"
# `ty` is a whole-project checker: it resolves imports across the package, so it
# cannot narrow to one file. It is therefore opt-in rather than part of the
# pre-commit gate — `just typecheck` and CI still run it on every change.
entry = "uv run ty check"
language = "system"
stages = ["manual"]
pass_filenames = false

[[repos.hooks]]
id = "uv-lock"
name = "uv lock"
entry = "uv lock"
language = "system"
pass_filenames = false
files = '^pyproject\.toml$'
